    <!-- улыбка -->
    <path d="M45 52 Q50 56 55 52" stroke="#c2756a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- румянец -->
    <ellipse cx="38" cy="49" rx="3.6" ry="2.4" fill="#f5b8d8" opacity="0.75"/>
    <ellipse cx="62" cy="49" rx="3.6" ry="2.4" fill="#f5b8d8" opacity="0.75"/>
