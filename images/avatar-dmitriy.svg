<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Дмитрий">
  <defs>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="100" height="100" fill="#fff6d5"/>
    <!-- рубашка / плечи -->
    <path d="M17 100 C17 77 31 63 50 63 C69 63 83 77 83 100 Z" fill="#c9b3e8"/>
