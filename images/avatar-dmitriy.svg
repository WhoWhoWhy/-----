    <!-- глаза -->
    <circle cx="43" cy="45" r="2.2" fill="#3d2e4d"/>
    <circle cx="57" cy="45" r="2.2" fill="#3d2e4d"/>
    <!-- улыбка -->
    <path d="M45 52 Q50 56 55 52" stroke="#c2756a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- румянец -->
    <ellipse cx="39" cy="48" rx="3.2" ry="2.2" fill="#f5b8d8" opacity="0.75"/>
    <ellipse cx="61" cy="48" rx="3.2" ry="2.2" fill="#f5b8d8" opacity="0.75"/>
