      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="100" height="100" fill="#fff6d5"/>
    <!-- рубашка / плечи -->
    <path d="M14 100 C14 76 29 61 50 61 C71 61 86 76 86 100 Z" fill="#c9b3e8"/>
