    <path d="M31 40 C31 32 35 26 42 23 C46 29 54 29 58 23 C65 26 69 32 69 40 C69 30 60 26 50 26 C40 26 31 30 31 40 Z" fill="#d96a3f"/>
    <!-- глаза -->
    <circle cx="42" cy="45" r="2.2" fill="#3d2e4d"/>
    <circle cx="58" cy="45" r="2.2" fill="#3d2e4d"/>
    <!-- улыбка -->
    <path d="M44 52 Q50 57 56 52" stroke="#c2756a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- румянец -->
    <ellipse cx="37" cy="49" rx="4" ry="2.6" fill="#e98fb8" opacity="0.8"/>
    <ellipse cx="63" cy="49" rx="4" ry="2.6" fill="#e98fb8" opacity="0.8"/>
  </g>
</svg>