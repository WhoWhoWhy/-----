      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="100" height="100" fill="#fce4f0"/>
    <!-- платье / плечи -->
    <path d="M13 100 C13 74 28 59 50 59 C72 59 87 74 87 100 Z" fill="#f5b8d8"/>
    <!-- шея -->
    <rect x="43" y="46" width="14" height="18" rx="7" fill="#efb98c"/>
