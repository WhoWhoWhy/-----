<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Екатерина">
  <defs>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="100" height="100" fill="#fce4f0"/>
    <!-- платье / плечи -->
    <path d="M16 100 C16 76 30 62 50 62 C70 62 84 76 84 100 Z" fill="#f5b8d8"/>
    <!-- шея -->
    <rect x="43" y="46" width="14" height="18" rx="7" fill="#efb98c"/>
    <!-- лицо -->
    <ellipse cx="50" cy="43" rx="18" ry="20" fill="#f6d3b0"/>
    <!-- причёска-каре: верх + боковые пряди -->
    <path d="M29 40 C29 18 40 10 50 10 C60 10 71 18 71 40 Z" fill="#c75a33"/>
    <rect x="28" y="32" width="7" height="32" rx="3.5" fill="#c75a33"/>
    <rect x="65" y="32" width="7" height="32" rx="3.5" fill="#c75a33"/>
    <!-- глаза -->
    <circle cx="43" cy="45" r="2.2" fill="#3d2e4d"/>
    <circle cx="57" cy="45" r="2.2" fill="#3d2e4d"/>
    <!-- улыбка -->
    <path d="M45 52 Q50 56 55 52" stroke="#c2756a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- румянец -->
    <ellipse cx="40" cy="48" rx="3.4" ry="2.4" fill="#e98fb8" opacity="0.8"/>
    <ellipse cx="60" cy="48" rx="3.4" ry="2.4" fill="#e98fb8" opacity="0.8"/>
  </g>
</svg>